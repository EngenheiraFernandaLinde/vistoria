<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vistoria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(201,169,110,0.2)}
:root{--gold:#C9A96E;--gold-l:#e8d5b0;--gold-d:#9a7a4a;--or:#D47C2A;--gray:#666;--fbg:#d4c5a9;--bd:#ddd;--r:12px}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,sans-serif;background:#f5f0eb;font-size:15px;color:#333;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.show{display:flex}
.topbar{background:#fff;border-bottom:3px solid var(--gold);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700;color:#222;flex:1}
.topbar svg{width:34px;height:34px;flex-shrink:0}
.back-btn{font-size:24px;color:var(--gold-d);background:none;border:none;padding:4px 8px;cursor:pointer;font-weight:700}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:var(--r);border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif;margin-bottom:10px;-webkit-appearance:none}
.btn-gold{background:var(--gold);color:#fff}
.btn-outline{background:#fff;color:var(--gold-d);border:2px solid var(--gold)}
.btn-red{background:#dc3545;color:#fff}
.btn-green{background:#2d7a3a;color:#fff}
.btn-gray{background:#f0f0f0;color:#444;border:1px solid var(--bd)}
.btn-row{display:flex;gap:8px;margin-bottom:10px}
.btn-row .btn{margin-bottom:0}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--bd);padding:14px;margin-bottom:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--gray);font-weight:600;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:13px 14px;border:2px solid var(--bd);border-radius:10px;font-size:15px;font-family:-apple-system,sans-serif;color:#333;background:#fff;-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cc-item{display:flex;align-items:center;gap:8px;padding:12px 10px;border:2px solid var(--bd);border-radius:10px;cursor:pointer;font-size:14px;background:#fff}
.cc-item.on{border-color:var(--gold);background:var(--gold-l);font-weight:600}
.cc-item .ck{width:20px;height:20px;border-radius:5px;border:2px solid var(--bd);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.cc-item.on .ck{background:var(--gold);border-color:var(--gold);color:#fff}
.vc{background:#fff;border-radius:var(--r);border:1px solid var(--bd);border-left:4px solid var(--gold);padding:14px;margin-bottom:12px}
.vc h3{font-size:16px;font-weight:700;color:#222;margin-bottom:4px}
.vc p{font-size:13px;color:var(--gray);margin-bottom:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--gold-l);color:var(--gold-d);margin-top:6px}
.com-row{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.com-row h4{font-size:14px;font-weight:700;color:#222}
.com-row p{font-size:12px;color:var(--gray)}
.com-btn{background:var(--gold);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.fi{background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;overflow:hidden}
.fi img{width:100%;height:auto;object-fit:contain;display:block;background:#000}
.fi-body{padding:12px}
.fi-num{font-size:11px;color:var(--gray);font-weight:600;margin-bottom:6px}
.fi-text{font-size:14px;line-height:1.5;margin-bottom:4px}
.fi-actions{display:flex;gap:8px;margin-top:10px}
.fi-btn{flex:1;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer}
.fi.dragging{opacity:0.4}
.fi.drag-over{border:2px solid var(--gold)}
.drag-handle{font-size:22px;color:#bbb;padding:0 6px 0 0;cursor:grab;user-select:none}
.foto-prev{width:100%;border-radius:10px;margin-bottom:12px;display:block;max-height:220px;object-fit:cover}
.empty{text-align:center;padding:40px 20px;color:var(--gray)}
.empty-ico{font-size:48px;margin-bottom:12px}
.empty p{font-size:15px;line-height:1.6}
.sec-title{font-size:13px;font-weight:700;color:var(--or);text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--gold-l);padding-bottom:6px;margin-bottom:12px}
.rep-foto{width:100%;border-radius:8px;margin-bottom:6px;display:block;height:auto;object-fit:contain}
.rep-caption{font-size:11px;text-align:center;color:var(--gray);font-style:italic;margin-bottom:10px}
</style>
</head>
<body>

<div class="screen show" id="s-home">
  <div class="topbar">
    <svg viewBox="0 0 44 44" fill="none"><polygon points="22,4 38,20 6,20" fill="none" stroke="#C9A96E" stroke-width="1.8"/><rect x="12" y="20" width="20" height="16" fill="none" stroke="#C9A96E" stroke-width="1.8"/><rect x="17" y="26" width="10" height="10" fill="none" stroke="#C9A96E" stroke-width="1.4"/><line x1="4" y1="20" x2="40" y2="20" stroke="#C9A96E" stroke-width="1.4"/><line x1="27" y1="12" x2="40" y2="25" stroke="#C9A96E" stroke-width="1.4"/></svg>
    <div class="topbar-title">Fernanda Linde</div>
    <button style="border-radius:8px;padding:8px 12px;border:1px solid var(--bd);background:#f0f0f0;font-size:13px;font-weight:700;cursor:pointer" onclick="exportarBackup()">💾</button>
  </div>
  <div class="scroll">
    <button class="btn btn-gold" onclick="goTo('s-nova')">+ Nova Vistoria</button>
    <div id="lista"></div>
  </div>
</div>

<div class="screen" id="s-nova">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-home')">&#8249;</button>
    <div class="topbar-title">Nova Vistoria</div>
  </div>
  <div class="scroll">
    <div class="field"><label>Nome do cliente *</label><input type="text" id="n-cli" placeholder="Ex: Joao Silva" autocomplete="off"></div>
    <div class="field"><label>Empreendimento / Condominio</label><input type="text" id="n-emp" placeholder="Ex: Cond. Porto Fazenda Real" autocomplete="off"></div>
    <div class="field-row">
      <div class="field" style="margin:0"><label>Unidade</label><input type="text" id="n-uni" placeholder="Apto 202, T3" autocomplete="off"></div>
      <div class="field" style="margin:0"><label>Data</label><input type="date" id="n-dat"></div>
    </div>
    <div class="field"><label>Endereco</label><input type="text" id="n-end" placeholder="Rua, n - Bairro - Cidade" autocomplete="off"></div>
    <div class="field">
      <label style="margin-bottom:10px;display:block">Comodos da vistoria</label>
      <div class="cc-grid" id="cc-grid"></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <input type="text" id="n-cust" placeholder="Comodo personalizado..." style="flex:1;padding:11px 12px;border:2px solid var(--bd);border-radius:10px;font-size:14px;font-family:-apple-system,sans-serif">
        <button onclick="addCustomCC()" style="background:var(--gold);color:#fff;border:none;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap">+ Add</button>
      </div>
    </div>
    <button class="btn btn-gold" onclick="criarVistoria()">Criar Vistoria</button>
    <button class="btn btn-outline" onclick="goTo('s-home')">Cancelar</button>
  </div>
</div>

<div class="screen" id="s-editor">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-home')">&#8249;</button>
    <div class="topbar-title" id="ed-title">Vistoria</div>
  </div>
  <div class="scroll" id="ed-scroll">
    <div id="ed-content"></div>
  </div>
</div>

<div class="screen" id="s-comodo">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-editor')">&#8249;</button>
    <div class="topbar-title" id="com-title">Comodo</div>
  </div>
  <div class="scroll">
    <button class="btn btn-gold" onclick="goTo('s-foto-cam')">&#128247; Tirar Foto</button>
    <button class="btn btn-outline" onclick="goTo('s-foto-lib')">&#128444; Escolher da Galeria</button>
    <button class="btn btn-gray" onclick="goTo('s-anotacao')">&#128221; So anotacao (sem foto)</button>
    <div class="sec-title" style="margin-top:4px">Fotos registradas</div>
    <div id="fotos-list"></div>
  </div>
</div>

<div class="screen" id="s-foto-cam">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-comodo')">&#8249;</button>
    <div class="topbar-title">Tirar Foto</div>
  </div>
  <div class="scroll">
    <p style="font-size:14px;color:var(--gray);margin-bottom:16px">Toque no botao abaixo para abrir a camera:</p>
    <label style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:20px;border-radius:var(--r);background:var(--gold);color:#fff;font-size:18px;font-weight:700;cursor:pointer;margin-bottom:10px">
      &#128247; Abrir Camera
      <input type="file" accept="image/*" capture="environment" style="display:none" onchange="onFotoCapturada(event)">
    </label>
    <button class="btn btn-outline" onclick="goTo('s-comodo')">Cancelar</button>
  </div>
</div>

<div class="screen" id="s-foto-lib">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-comodo')">&#8249;</button>
    <div class="topbar-title">Galeria</div>
  </div>
  <div class="scroll">
    <p style="font-size:14px;color:var(--gray);margin-bottom:16px">Escolha uma ou mais fotos:</p>
    <label style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:20px;border-radius:var(--r);background:var(--gold);color:#fff;font-size:18px;font-weight:700;cursor:pointer;margin-bottom:10px">
      &#128444; Abrir Galeria
      <input type="file" accept="image/*" multiple style="display:none" onchange="onFotoCapturada(event)">
    </label>
    <button class="btn btn-outline" onclick="goTo('s-comodo')">Cancelar</button>
  </div>
</div>

<div class="screen" id="s-legenda">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-comodo')">&#8249;</button>
    <div class="topbar-title">Legenda</div>
  </div>
  <div class="scroll">
    <div id="leg-preview"></div>
    <div class="field">
      <label>Descricao do problema</label>
      <textarea id="leg-desc" placeholder="Descreva o problema encontrado..." rows="4"></textarea>
    </div>
    <div class="field">
      <label>Prognostico</label>
      <textarea id="leg-prog" placeholder="Possivel consequencia se nao corrigido..." rows="3"></textarea>
    </div>
    <button class="btn btn-gold" onclick="salvarFotoFinal()">&#10003; Salvar Foto</button>
    <button class="btn btn-outline" onclick="goTo('s-comodo')">Cancelar</button>
  </div>
</div>

<div class="screen" id="s-anotacao">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-comodo')">&#8249;</button>
    <div class="topbar-title">Anotacao</div>
  </div>
  <div class="scroll">
    <div class="field">
      <label>Descricao</label>
      <textarea id="anot-desc" placeholder="Descreva o problema..." rows="4"></textarea>
    </div>
    <div class="field">
      <label>Prognostico</label>
      <textarea id="anot-prog" placeholder="Possivel consequencia..." rows="3"></textarea>
    </div>
    <button class="btn btn-gold" onclick="salvarAnotacao()">&#10003; Salvar</button>
    <button class="btn btn-outline" onclick="goTo('s-comodo')">Cancelar</button>
  </div>
</div>

<div class="screen" id="s-edit-foto">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-comodo')">&#8249;</button>
    <div class="topbar-title">Editar Foto</div>
  </div>
  <div class="scroll">
    <div id="ef-preview"></div>
    <div class="field">
      <label>Descricao</label>
      <textarea id="ef-desc" rows="4"></textarea>
    </div>
    <div class="field">
      <label>Prognostico</label>
      <textarea id="ef-prog" rows="3"></textarea>
    </div>
    <button class="btn btn-gold" onclick="salvarEdicaoFoto()">&#10003; Salvar</button>
    <button class="btn btn-outline" onclick="goTo('s-comodo')">Cancelar</button>
  </div>
</div>

<div class="screen" id="s-edit-dados">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-editor')">&#8249;</button>
    <div class="topbar-title">Editar Dados</div>
  </div>
  <div class="scroll">
    <div class="field"><label>Cliente</label><input type="text" id="ed-cli" autocomplete="off"></div>
    <div class="field"><label>Empreendimento</label><input type="text" id="ed-emp" autocomplete="off"></div>
    <div class="field-row">
      <div class="field" style="margin:0"><label>Unidade</label><input type="text" id="ed-uni" autocomplete="off"></div>
      <div class="field" style="margin:0"><label>Data</label><input type="date" id="ed-dat"></div>
    </div>
    <div class="field"><label>Endereco</label><input type="text" id="ed-end" autocomplete="off"></div>
    <div class="field"><label>Sistemas inspecionados</label><textarea id="ed-sis" rows="3"></textarea></div>
    <button class="btn btn-gold" onclick="salvarDados()">&#10003; Salvar</button>
    <button class="btn btn-outline" onclick="goTo('s-editor')">Cancelar</button>
  </div>
</div>

<div class="screen" id="s-relatorio">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-editor')">&#8249;</button>
    <div class="topbar-title">Relatorio</div>
  </div>
  <div class="scroll">
    <button class="btn btn-green" onclick="gerarPDF()">&#11015; Baixar PDF</button>
    <div id="rep-content"></div>
  </div>
</div>

<div class="screen" id="s-conclusao">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-editor')">&#8249;</button>
    <div class="topbar-title">Conclusao</div>
  </div>
  <div class="scroll">
    <div class="field">
      <label>Texto de conclusao do relatorio</label>
      <textarea id="conc-txt" rows="8"></textarea>
    </div>
    <button class="btn btn-gold" onclick="salvarConclusao()">&#10003; Salvar</button>
    <button class="btn btn-outline" onclick="goTo('s-editor')">Cancelar</button>
  </div>
</div>

<script>
const COMODOS_P=['Porta de Entrada','Sala de Estar','Cozinha','Lavanderia','Banheiro Social','Suíte','Banheiro Suíte','Dormitório 1','Dormitório 2','Sacada / Varanda','Hall / Corredor','Área de Serviço'];
let DB=JSON.parse(localStorage.getItem('vdb')||'{"v":[]}');
let CC=JSON.parse(localStorage.getItem('vcc')||'[]');
let VID=null,COM=null,EIDX=null,PENDIMG=[];
let ccSel=new Set(COMODOS_P.slice(0,9));

function save(){localStorage.setItem('vdb',JSON.stringify(DB))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function v(){return DB.v.find(x=>x.id===VID)}

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  document.getElementById(id).classList.add('show');
  window.scrollTo(0,0);
  if(id==='s-home')renderHome();
  if(id==='s-nova')initNova();
  if(id==='s-editor')renderEditor();
  if(id==='s-comodo')renderComodo();
  if(id==='s-relatorio')renderRelatorio();
}

function toast(msg,type){
  document.querySelectorAll('.t').forEach(x=>x.remove());
  const t=document.createElement('div');
  t.className='t';
  t.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:24px;font-size:14px;font-weight:600;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.2);color:#fff;background:'+(type==='err'?'#dc3545':'#2d7a3a');
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function renderHome(){
  const el=document.getElementById('lista');
  if(!DB.v.length){
    el.innerHTML='<div class="empty"><div class="empty-ico">&#128203;</div><p>Nenhuma vistoria ainda.<br>Toque em <strong>+ Nova Vistoria</strong>.</p></div>';
    return;
  }
  el.innerHTML=DB.v.slice().reverse().map(vv=>{
    const tot=Object.values(vv.comodos).reduce((a,b)=>a+b.length,0);
    return '<div class="vc"><h3>'+vv.cli+'</h3><p>'+(vv.emp||'')+' '+(vv.uni?'- '+vv.uni:'')+'</p><div><span class="badge">'+(vv.dat||vv.cr)+'</span></div><p style="font-size:12px;color:var(--gray);margin-top:6px">'+Object.keys(vv.comodos).length+' comodos - '+tot+' foto'+(tot!==1?'s':'')+'</p><div class="btn-row" style="margin-top:12px"><button class="btn btn-gold" style="font-size:14px;padding:12px 8px" onclick="abrirEditor(\''+vv.id+'\')">&#9998; Editar</button><button class="btn btn-outline" style="font-size:14px;padding:12px 8px" onclick="abrirRelatorio(\''+vv.id+'\')">&#128196; PDF</button><button class="btn btn-red" style="flex:0.4;font-size:14px;padding:12px 8px" onclick="excluir(\''+vv.id+'\')">&#128465;</button></div></div>';
  }).join('');
}

function initNova(){
  document.getElementById('n-dat').value=new Date().toISOString().slice(0,10);
  buildCC();
}

function buildCC(){
  const all=[...COMODOS_P,...CC];
  document.getElementById('cc-grid').innerHTML=all.map(c=>{
    const on=ccSel.has(c);
    return '<div class="cc-item '+(on?'on':'')+'" onclick="toggleCC(this,\''+c+'\')"><div class="ck">'+(on?'&#10003;':'')+'</div><span style="font-size:13px">'+c+'</span></div>';
  }).join('');
}

function toggleCC(el,c){
  if(ccSel.has(c)){ccSel.delete(c);el.classList.remove('on');el.querySelector('.ck').textContent=''}
  else{ccSel.add(c);el.classList.add('on');el.querySelector('.ck').textContent='&#10003;'}
}

function addCustomCC(){
  const inp=document.getElementById('n-cust');
  const val=inp.value.trim();if(!val)return;
  if(!CC.includes(val)){CC.push(val);localStorage.setItem('vcc',JSON.stringify(CC))}
  ccSel.add(val);inp.value='';buildCC();
}

function criarVistoria(){
  const cli=document.getElementById('n-cli').value.trim();
  if(!cli){toast('Informe o nome do cliente','err');return}
  const comodos={};[...ccSel].forEach(c=>{comodos[c]=[]});
  const vv={id:uid(),cli,emp:document.getElementById('n-emp').value.trim(),uni:document.getElementById('n-uni').value.trim(),dat:document.getElementById('n-dat').value,end:document.getElementById('n-end').value.trim(),cr:new Date().toLocaleDateString('pt-BR'),comodos,sis:'Esquadrias (portas e janelas); Revestimentos e pinturas; Peças cerâmicas (pisos e azulejos); Sistema hidrossanitário e elétrico; Louças e metais; Estrutura (visualmente).',conc:'Após vistoria técnica foram identificados pontos de atenção que, caso não sejam corrigidos, poderão resultar em manifestações patológicas futuras, comprometendo o desempenho e a durabilidade dos elementos construtivos. Além disso, foram constatadas irregularidades cobertas pelas condições de garantia, conforme previsto nos termos contratuais e nas normas técnicas aplicáveis.'};
  DB.v.push(vv);save();
  ['n-cli','n-emp','n-uni','n-end'].forEach(id=>document.getElementById(id).value='');
  toast('Vistoria criada!');abrirEditor(vv.id);
}

function excluir(id){
  if(!confirm('Excluir esta vistoria?'))return;
  DB.v=DB.v.filter(x=>x.id!==id);save();renderHome();
}

function abrirEditor(id){VID=id;goTo('s-editor')}

function renderEditor(){
  const vv=v();if(!vv)return;
  document.getElementById('ed-title').textContent=vv.cli||'Vistoria';
  const comodos=Object.keys(vv.comodos);
  const tot=Object.values(vv.comodos).reduce((a,b)=>a+b.length,0);

function compress(dataUrl,maxW,q){
  maxW=maxW||1200;q=q||0.75;
  return new Promise(function(res){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',q));
    };img.src=dataUrl;
  });
}

    +'<button onclick="gcAddCustom()" style="background:var(--gold);color:#fff;border:none;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer">+ Add</button>'
    +'</div>'
    +'<button onclick="gcSalvar()" style="width:100%;padding:16px;background:var(--gold);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px">✓ Salvar</button>'
    +'<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="width:100%;padding:14px;background:#fff;color:var(--gold-d);border:2px solid var(--gold);border-radius:12px;font-size:16px;font-weight:700;cursor:pointer">Cancelar</button>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  window.gcToggle=function(el,c){
    if(el.classList.contains('on')){el.classList.remove('on');el.querySelector('.ck').textContent=''}
    else{el.classList.add('on');el.querySelector('.ck').textContent='✓'}
  };
  window.gcAddCustom=function(){
    const inp=document.getElementById('gc-cust');
    const val=inp.value.trim();if(!val)return;
    if(!CC.includes(val)){CC.push(val);localStorage.setItem('vcc',JSON.stringify(CC))}
    const grid=document.getElementById('gc-grid');
    const div=document.createElement('div');
    div.className='cc-item on';
    div.setAttribute('onclick','gcToggle(this,\''+val+'\')');
    div.innerHTML='<div class="ck">✓</div><span style="font-size:13px">'+val+'</span>';
    grid.appendChild(div);
    inp.value='';
  };
  window.gcSalvar=function(){
    const sel=[...document.querySelectorAll('#gc-grid .cc-item.on')].map(el=>el.querySelector('span').textContent.trim());
    const novo={};
    sel.forEach(c=>{novo[c]=vv.comodos[c]||[]});
    vv.comodos=novo;
    save();overlay.remove();renderEditor();toast('Cômodos atualizados!');
  };
}

function exportarBackup(){
  var blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='backup_vistorias_'+new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')+'.json';
  a.click();URL.revokeObjectURL(url);toast('Backup exportado!');
}

renderHome();
</script>
</body>
</html>
