<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vistoria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(201,169,110,0.2)}
:root{--gold:#C9A96E;--gold-l:#e8d5b0;--gold-d:#9a7a4a;--or:#D47C2A;--gray:#666;--fbg:#d4c5a9;--bd:#ddd;--r:12px}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,sans-serif;background:#f5f0eb;font-size:15px;color:#333;display:flex;flex-direction:column}

/* SCREENS */
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.show{display:flex}

/* TOP BAR */
.topbar{background:#fff;border-bottom:3px solid var(--gold);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700;color:#222;flex:1}
.topbar svg{width:34px;height:34px;flex-shrink:0}
.back-btn{font-size:24px;color:var(--gold-d);background:none;border:none;padding:4px 8px;cursor:pointer;font-weight:700}

/* SCROLL AREA */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:var(--r);border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif;margin-bottom:10px;-webkit-appearance:none}
.btn-gold{background:var(--gold);color:#fff}
.btn-outline{background:#fff;color:var(--gold-d);border:2px solid var(--gold)}
.btn-red{background:#dc3545;color:#fff}
.btn-green{background:#2d7a3a;color:#fff}
.btn-gray{background:#f0f0f0;color:#444;border:1px solid var(--bd)}
.btn-row{display:flex;gap:8px;margin-bottom:10px}
.btn-row .btn{margin-bottom:0}

/* CARDS */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--bd);padding:14px;margin-bottom:12px}
.card-or{border-left:4px solid var(--gold)}

/* FORMS */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--gray);font-weight:600;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:13px 14px;border:2px solid var(--bd);border-radius:10px;font-size:15px;font-family:-apple-system,sans-serif;color:#333;background:#fff;-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}

/* COMODO CHECK */
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cc-item{display:flex;align-items:center;gap:8px;padding:12px 10px;border:2px solid var(--bd);border-radius:10px;cursor:pointer;font-size:14px;background:#fff}
.cc-item.on{border-color:var(--gold);background:var(--gold-l);font-weight:600}
.cc-item .ck{width:20px;height:20px;border-radius:5px;border:2px solid var(--bd);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.cc-item.on .ck{background:var(--gold);border-color:var(--gold);color:#fff}

/* VISTORIA CARD */
.vc{background:#fff;border-radius:var(--r);border:1px solid var(--bd);border-left:4px solid var(--gold);padding:14px;margin-bottom:12px}
.vc h3{font-size:16px;font-weight:700;color:#222;margin-bottom:4px}
.vc p{font-size:13px;color:var(--gray);margin-bottom:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--gold-l);color:var(--gold-d);margin-top:6px}

/* COMODO ROW */
.com-row{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.com-row h4{font-size:14px;font-weight:700;color:#222}
.com-row p{font-size:12px;color:var(--gray)}
.com-btn{background:var(--gold);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}

/* FOTO ITEM */
.fi{background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;overflow:hidden}
.fi img{width:100%;max-height:240px;object-fit:cover;display:block}
.fi-body{padding:12px}
.fi-num{font-size:11px;color:var(--gray);font-weight:600;margin-bottom:6px}
.fi-text{font-size:14px;line-height:1.5;margin-bottom:4px}
.fi-actions{display:flex;gap:8px;margin-top:10px}
.fi-btn{flex:1;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer}

/* DRAG */
.fi.dragging{opacity:0.4}
.fi.drag-over{border:2px solid var(--gold)}
.drag-handle{font-size:22px;color:#bbb;padding:0 6px 0 0;cursor:grab;user-select:none}

/* FOTO PREVIEW */
.foto-prev{width:100%;border-radius:10px;margin-bottom:12px;display:block;max-height:220px;object-fit:cover}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--gray)}
.empty-ico{font-size:48px;margin-bottom:12px}
.empty p{font-size:15px;line-height:1.6}

/* SECTION TITLE */
.sec-title{font-size:13px;font-weight:700;color:var(--or);text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--gold-l);padding-bottom:6px;margin-bottom:12px}

/* REPORT */
.rep-foto{width:100%;border-radius:8px;margin-bottom:6px;display:block;max-height:260px;object-fit:cover}
.rep-caption{font-size:11px;text-align:center;color:var(--gray);font-style:italic;margin-bottom:10px}
</style>
</head>
<body>

<!-- ══ TELA: LISTA DE VISTORIAS ══ -->
<div class="screen show" id="s-home">
  <div class="topbar">
    <svg viewBox="0 0 44 44" fill="none"><polygon points="22,4 38,20 6,20" fill="none" stroke="#C9A96E" stroke-width="1.8"/><rect x="12" y="20" width="20" height="16" fill="none" stroke="#C9A96E" stroke-width="1.8"/><rect x="17" y="26" width="10" height="10" fill="none" stroke="#C9A96E" stroke-width="1.4"/><line x1="4" y1="20" x2="40" y2="20" stroke="#C9A96E" stroke-width="1.4"/><line x1="27" y1="12" x2="40" y2="25" stroke="#C9A96E" stroke-width="1.4"/></svg>
    <div class="topbar-title">Fernanda Linde</div>
    <button class="btn-gray" style="border-radius:8px;padding:8px 12px;border:1px solid var(--bd);background:#f0f0f0;font-size:13px;font-weight:700;cursor:pointer" onclick="exportarBackup()">💾</button>
  </div>
  <div class="scroll">
    <button class="btn btn-gold" onclick="goTo('s-nova')">+ Nova Vistoria</button>
    <div id="lista"></div>
  </div>
</div>

<!-- ══ TELA: NOVA VISTORIA ══ -->
<div class="screen" id="s-nova">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-home')">‹</button>
    <div class="topbar-title">Nova Vistoria</div>
  </div>
  <div class="scroll">
    <div class="field"><label>Nome do cliente *</label><input type="text" id="n-cli" placeholder="Ex: João Silva" autocomplete="off"></div>
    <div class="field"><label>Empreendimento / Condomínio</label><input type="text" id="n-emp" placeholder="Ex: Cond. Porto Fazenda Real" autocomplete="off"></div>
    <div class="field-row">
      <div class="field" style="margin:0"><label>Unidade</label><input type="text" id="n-uni" placeholder="Apto 202, T3" autocomplete="off"></div>
      <div class="field" style="margin:0"><label>Data</label><input type="date" id="n-dat"></div>
    </div>
    <div class="field"><label>Endereço</label><input type="text" id="n-end" placeholder="Rua, nº – Bairro – Cidade" autocomplete="off"></div>

    <div class="field">
      <label style="margin-bottom:10px;display:block">Cômodos da vistoria</label>
      <div class="cc-grid" id="cc-grid"></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <input type="text" id="n-cust" placeholder="Cômodo personalizado..." style="flex:1;padding:11px 12px;border:2px solid var(--bd);border-radius:10px;font-size:14px;font-family:-apple-system,sans-serif">
        <button onclick="addCustomCC()" style="background:var(--gold);color:#fff;border:none;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap">+ Add</button>
      </div>
    </div>

    <button class="btn btn-gold" onclick="criarVistoria()">Criar Vistoria</button>
    <button class="btn btn-outline" onclick="goTo('s-home')">Cancelar</button>
  </div>
</div>

<!-- ══ TELA: EDITOR VISTORIA ══ -->
<div class="screen" id="s-editor">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-home')">‹</button>
    <div class="topbar-title" id="ed-title">Vistoria</div>
  </div>
  <div class="scroll" id="ed-scroll">
    <div id="ed-content"></div>
  </div>
</div>

<!-- ══ TELA: CÔMODO (fotos) ══ -->
<div class="screen" id="s-comodo">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-editor')">‹</button>
    <div class="topbar-title" id="com-title">Cômodo</div>
  </div>
  <div class="scroll">
    <button class="btn btn-gold" onclick="goTo('s-foto-cam')">📷 Tirar Foto</button>
    <button class="btn btn-outline" onclick="goTo('s-foto-lib')">🖼️ Escolher da Galeria</button>
    <button class="btn btn-gray" onclick="goTo('s-anotacao')">📝 Só anotação (sem foto)</button>
    <div class="sec-title" style="margin-top:4px">Fotos registradas</div>
    <div id="fotos-list"></div>
  </div>
</div>

<!-- ══ TELA: TIRAR FOTO (câmera) ══ -->
<div class="screen" id="s-foto-cam">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-comodo')">‹</button>
    <div class="topbar-title">Tirar Foto</div>
  </div>
  <div class="scroll">
    <p style="font-size:14px;color:var(--gray);margin-bottom:16px">Toque no botão abaixo para abrir a câmera:</p>
    <label style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:20px;border-radius:var(--r);background:var(--gold);color:#fff;font-size:18px;font-weight:700;cursor:pointer;margin-bottom:10px">
      📷 Abrir Câmera
      <input type="file" accept="image/*" capture="environment" style="display:none" onchange="onFotoCapturada(event)">
    </label>
    <button class="btn btn-outline" onclick="goTo('s-comodo')">Cancelar</button>
  </div>
</div>

<!-- ══ TELA: GALERIA ══ -->
<div class="screen" id="s-foto-lib">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-comodo')">‹</button>
    <div class="topbar-title">Galeria</div>
  </div>
  <div class="scroll">
    <p style="font-size:14px;color:var(--gray);margin-bottom:16px">Escolha uma ou mais fotos:</p>
    <label style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:20px;border-radius:var(--r);background:var(--gold);color:#fff;font-size:18px;font-weight:700;cursor:pointer;margin-bottom:10px">
      🖼️ Abrir Galeria
      <input type="file" accept="image/*" multiple style="display:none" onchange="onFotoCapturada(event)">
    </label>
    <button class="btn btn-outline" onclick="goTo('s-comodo')">Cancelar</button>
  </div>
</div>

<!-- ══ TELA: LEGENDA DA FOTO ══ -->
<div class="screen" id="s-legenda">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-comodo')">‹</button>
    <div class="topbar-title">Legenda</div>
  </div>
  <div class="scroll">
    <div id="leg-preview"></div>
    <div class="field">
      <label>Descrição do problema <span style="font-weight:400;color:var(--gray)">(sem limite)</span></label>
      <textarea id="leg-desc" placeholder="Descreva o problema encontrado..." rows="4"></textarea>
    </div>
    <div class="field">
      <label>Prognóstico</label>
      <textarea id="leg-prog" placeholder="Possível consequência se não corrigido..." rows="3"></textarea>
    </div>
    <button class="btn btn-gold" onclick="salvarFotoFinal()">✓ Salvar Foto</button>
    <button class="btn btn-outline" onclick="goTo('s-comodo')">Cancelar</button>
  </div>
</div>

<!-- ══ TELA: SÓ ANOTAÇÃO ══ -->
<div class="screen" id="s-anotacao">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-comodo')">‹</button>
    <div class="topbar-title">Anotação</div>
  </div>
  <div class="scroll">
    <div class="field">
      <label>Descrição</label>
      <textarea id="anot-desc" placeholder="Descreva o problema..." rows="4"></textarea>
    </div>
    <div class="field">
      <label>Prognóstico</label>
      <textarea id="anot-prog" placeholder="Possível consequência..." rows="3"></textarea>
    </div>
    <button class="btn btn-gold" onclick="salvarAnotacao()">✓ Salvar</button>
    <button class="btn btn-outline" onclick="goTo('s-comodo')">Cancelar</button>
  </div>
</div>

<!-- ══ TELA: EDITAR FOTO ══ -->
<div class="screen" id="s-edit-foto">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-comodo')">‹</button>
    <div class="topbar-title">Editar Foto</div>
  </div>
  <div class="scroll">
    <div id="ef-preview"></div>
    <div class="field">
      <label>Descrição</label>
      <textarea id="ef-desc" rows="4"></textarea>
    </div>
    <div class="field">
      <label>Prognóstico</label>
      <textarea id="ef-prog" rows="3"></textarea>
    </div>
    <button class="btn btn-gold" onclick="salvarEdicaoFoto()">✓ Salvar</button>
    <button class="btn btn-outline" onclick="goTo('s-comodo')">Cancelar</button>
  </div>
</div>

<!-- ══ TELA: EDITAR DADOS ══ -->
<div class="screen" id="s-edit-dados">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-editor')">‹</button>
    <div class="topbar-title">Editar Dados</div>
  </div>
  <div class="scroll">
    <div class="field"><label>Cliente</label><input type="text" id="ed-cli" autocomplete="off"></div>
    <div class="field"><label>Empreendimento</label><input type="text" id="ed-emp" autocomplete="off"></div>
    <div class="field-row">
      <div class="field" style="margin:0"><label>Unidade</label><input type="text" id="ed-uni" autocomplete="off"></div>
      <div class="field" style="margin:0"><label>Data</label><input type="date" id="ed-dat"></div>
    </div>
    <div class="field"><label>Endereço</label><input type="text" id="ed-end" autocomplete="off"></div>
    <div class="field"><label>Sistemas inspecionados</label><textarea id="ed-sis" rows="3"></textarea></div>
    <button class="btn btn-gold" onclick="salvarDados()">✓ Salvar</button>
    <button class="btn btn-outline" onclick="goTo('s-editor')">Cancelar</button>
  </div>
</div>

<!-- ══ TELA: RELATÓRIO ══ -->
<div class="screen" id="s-relatorio">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-editor')">‹</button>
    <div class="topbar-title">Relatório</div>
  </div>
  <div class="scroll">
    <button class="btn btn-green" onclick="gerarPDF()">⬇️ Baixar PDF</button>
    <div id="rep-content"></div>
  </div>
</div>

<!-- ══ TELA: CONCLUSÃO ══ -->
<div class="screen" id="s-conclusao">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('s-editor')">‹</button>
    <div class="topbar-title">Conclusão</div>
  </div>
  <div class="scroll">
    <div class="field">
      <label>Texto de conclusão do relatório</label>
      <textarea id="conc-txt" rows="8"></textarea>
    </div>
    <button class="btn btn-gold" onclick="salvarConclusao()">✓ Salvar</button>
    <button class="btn btn-outline" onclick="goTo('s-editor')">Cancelar</button>
  </div>
</div>

<script>
// ═══ DATA ═══════════════════════════════════════════════════════════════
const COMODOS_P=['Porta de Entrada','Sala de Estar','Cozinha','Lavanderia','Banheiro Social','Suíte','Banheiro Suíte','Dormitório 1','Dormitório 2','Sacada / Varanda','Hall / Corredor','Área de Serviço'];
let DB=JSON.parse(localStorage.getItem('vdb')||'{"v":[]}');
let CC=JSON.parse(localStorage.getItem('vcc')||'[]');
let VID=null,COM=null,EIDX=null,PENDIMG=[];
let ccSel=new Set(COMODOS_P.slice(0,9));

function save(){localStorage.setItem('vdb',JSON.stringify(DB))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function v(){return DB.v.find(x=>x.id===VID)}

// ═══ NAVIGATION ══════════════════════════════════════════════════════
function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  document.getElementById(id).classList.add('show');
  window.scrollTo(0,0);
  if(id==='s-home')renderHome();
  if(id==='s-nova')initNova();
  if(id==='s-editor')renderEditor();
  if(id==='s-comodo')renderComodo();
  if(id==='s-relatorio')renderRelatorio();
}

function toast(msg,type='ok'){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:24px;font-size:14px;font-weight:600;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.2);color:#fff;background:${type==='err'?'#dc3545':'#2d7a3a'}`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

// ═══ HOME ════════════════════════════════════════════════════════════
function renderHome(){
  const el=document.getElementById('lista');
  if(!DB.v.length){
    el.innerHTML=`<div class="empty"><div class="empty-ico">📋</div><p>Nenhuma vistoria ainda.<br>Toque em <strong>+ Nova Vistoria</strong>.</p></div>`;
    return;
  }
  el.innerHTML=DB.v.slice().reverse().map(v=>{
    const tot=Object.values(v.comodos).reduce((a,b)=>a+b.length,0);
    return `<div class="vc">
      <h3>${v.cli||'Cliente'}</h3>
      <p>${v.emp||''} ${v.uni?'· '+v.uni:''}</p>
      <div><span class="badge">${v.dat||v.cr}</span></div>
      <p style="font-size:12px;color:var(--gray);margin-top:6px">${Object.keys(v.comodos).length} cômodos · ${tot} foto${tot!==1?'s':''}</p>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-gold" style="font-size:14px;padding:12px 8px" onclick="abrirEditor('${v.id}')">✏️ Editar</button>
        <button class="btn btn-outline" style="font-size:14px;padding:12px 8px" onclick="abrirRelatorio('${v.id}')">📄 PDF</button>
        <button class="btn btn-red" style="flex:0.4;font-size:14px;padding:12px 8px" onclick="excluir('${v.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

// ═══ NOVA VISTORIA ════════════════════════════════════════════════════
function initNova(){
  document.getElementById('n-dat').value=new Date().toISOString().slice(0,10);
  buildCC();
}

function buildCC(){
  const all=[...COMODOS_P,...CC];
  document.getElementById('cc-grid').innerHTML=all.map(c=>{
    const on=ccSel.has(c);
    return `<div class="cc-item ${on?'on':''}" onclick="toggleCC(this,'${c}')">
      <div class="ck">${on?'✓':''}</div>
      <span style="font-size:13px">${c}</span>
    </div>`;
  }).join('');
}

function toggleCC(el,c){
  if(ccSel.has(c)){ccSel.delete(c);el.classList.remove('on');el.querySelector('.ck').textContent=''}
  else{ccSel.add(c);el.classList.add('on');el.querySelector('.ck').textContent='✓'}
}

function addCustomCC(){
  const inp=document.getElementById('n-cust');
  const val=inp.value.trim();if(!val)return;
  if(!CC.includes(val)){CC.push(val);localStorage.setItem('vcc',JSON.stringify(CC))}
  ccSel.add(val);inp.value='';buildCC();
}

function criarVistoria(){
  const cli=document.getElementById('n-cli').value.trim();
  if(!cli){toast('Informe o nome do cliente','err');return}
  const comodos={};[...ccSel].forEach(c=>{comodos[c]=[]});
  const vv={
    id:uid(),cli,
    emp:document.getElementById('n-emp').value.trim(),
    uni:document.getElementById('n-uni').value.trim(),
    dat:document.getElementById('n-dat').value,
    end:document.getElementById('n-end').value.trim(),
    cr:new Date().toLocaleDateString('pt-BR'),
    comodos,
    sis:'Esquadrias (portas e janelas); Revestimentos e pinturas; Peças cerâmicas (pisos e azulejos); Sistema hidrossanitário e elétrico; Louças e metais; Estrutura (visualmente).',
    conc:'Após vistoria técnica foram identificados pontos de atenção que, caso não sejam corrigidos, poderão resultar em manifestações patológicas futuras, comprometendo o desempenho e a durabilidade dos elementos construtivos. Além disso, foram constatadas irregularidades cobertas pelas condições de garantia, conforme previsto nos termos contratuais e nas normas técnicas aplicáveis.'
  };
  DB.v.push(vv);save();
  ['n-cli','n-emp','n-uni','n-end'].forEach(id=>document.getElementById(id).value='');
  toast('Vistoria criada!');
  abrirEditor(vv.id);
}

function excluir(id){
  if(!confirm('Excluir esta vistoria?'))return;
  DB.v=DB.v.filter(x=>x.id!==id);save();renderHome();
}

// ═══ DRAG & DROP ══════════════════════════════════════════════════════
let dSrc=null;
function dS(e){dSrc=parseInt(e.currentTarget.dataset.idx);e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move'}
function dO(e){e.preventDefault();document.querySelectorAll('.fi').forEach(x=>x.classList.remove('drag-over'));e.currentTarget.classList.add('drag-over')}
function dD(e){
  e.preventDefault();
  const tIdx=parseInt(e.currentTarget.dataset.idx);
  if(dSrc===tIdx){document.querySelectorAll('.fi').forEach(x=>x.classList.remove('drag-over'));return}
  const arr=v().comodos[COM];
  const [m]=arr.splice(dSrc,1);arr.splice(tIdx,0,m);
  save();renderComodo();toast('Reordenado!');
}
function dE(){document.querySelectorAll('.fi').forEach(x=>{x.classList.remove('dragging');x.classList.remove('drag-over')})}

// ═══ FOTO ════════════════════════════════════════════════════════════
async function onFotoCapturada(e){
  const files=[...e.target.files];if(!files.length)return;
  toast('Processando...','info');
  PENDIMG=[];
  for(const f of files){
    const r=new FileReader();
    await new Promise(res=>{r.onload=async ev=>{
      const comp=await compress(ev.target.result);
      PENDIMG.push(comp);res();
    };r.readAsDataURL(f)});
  }
  // show preview & go to legenda
  const prev=document.getElementById('leg-preview');
  prev.innerHTML=PENDIMG.map(s=>`<img src="${s}" class="foto-prev">`).join('');
  document.getElementById('leg-desc').value='';
  document.getElementById('leg-prog').value='';
  goTo('s-legenda');
}

function salvarFotoFinal(){
  const leg=document.getElementById('leg-desc').value;
  const prog=document.getElementById('leg-prog').value;
  PENDIMG.forEach(src=>v().comodos[COM].push({src,leg,prog}));
  save();PENDIMG=[];
  toast(`${PENDIMG.length||'Foto'} salva${PENDIMG.length!==1?'s':''}!`);
  goTo('s-comodo');
}

// ═══ COMPRESSÃO ══════════════════════════════════════════════════════
function compress(dataUrl,maxW=1200,q=0.75){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',q));
    };img.src=dataUrl;
  });
}

// ═══ PDF ═════════════════════════════════════════════════════════════
function gerarPDF(){
  toast('Gerando PDF...','info');
  setTimeout(()=>{try{_pdf()}catch(e){toast('Erro ao gerar PDF','err');console.error(e)}},200);
}
function _pdf(){
  const vv=v();if(!vv)return;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const W=210,H=297,ML=20,MR=20,TW=W-ML-MR;
  const gold=[201,169,110],or=[212,124,42],gray=[102,102,102],dark=[34,34,34];
  let y=20;
  function np(){doc.addPage();y=20;hdr();ftr()}
  function hdr(){doc.setFillColor(...gold);doc.rect(0,0,W,1.5,'F');doc.setFontSize(14);doc.setFont('helvetica','bold');doc.setTextColor(...dark);doc.text('Fernanda Linde',ML+2,10);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(...gray);doc.text('Engenheira Civil  |  CREA RS263440',ML+2,15);y=24}
  function ftr(){doc.setFillColor(212,197,169);doc.rect(0,H-14,W,14,'F');doc.setFontSize(7.5);doc.setTextColor(85,85,85);doc.setFont('helvetica','normal');doc.text('engenheirafernandalinde@gmail.com',ML,H-6);doc.text('(51) 99500-1994',W/2-10,H-6);doc.text('@engenheirafernandalinde',W-52,H-6)}
  function chk(n=10){if(y+n>H-20)np()}
  function sT(t){chk(14);doc.setFillColor(248,243,235);doc.rect(ML,y-4,TW,10,'F');doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(...or);doc.text(t,ML+2,y+2);y+=10;doc.setFillColor(...gold);doc.rect(ML,y-1,TW,0.5,'F');y+=6}
  function bT(t,opts={}){doc.setFontSize(opts.sz||9.5);doc.setFont('helvetica',opts.st||'normal');doc.setTextColor(...(opts.cl||dark));const ls=doc.splitTextToSize(t,TW);chk(ls.length*5+2);doc.text(ls,ML,y);y+=ls.length*5+2}

  hdr();ftr();
  doc.setFillColor(248,243,235);doc.rect(ML,y+5,TW,60,'F');
  doc.setFontSize(18);doc.setFont('helvetica','bold');doc.setTextColor(...or);
  doc.text('Relatório Técnico de Vistoria\nde Imóvel Novo',W/2,y+30,{align:'center'});

  np();doc.setFontSize(16);doc.setFont('helvetica','bold');doc.setTextColor(...or);doc.text('Sumário',W/2,y,{align:'center'});y+=10;
  doc.setFillColor(...gold);doc.rect(ML,y,TW,0.5,'F');y+=8;
  const comodos=Object.keys(vv.comodos);
  ['1. Identificação do solicitante','2. Dados iniciais','3. Sistemas construtivos inspecionados',
    ...comodos.map((c,i)=>`${i+4}. ${c}`),`${comodos.length+4}. Conclusão`
  ].forEach((item,i)=>{doc.setFontSize(9.5);doc.setFont('helvetica','normal');doc.setTextColor(...dark);doc.text(item,ML,y);doc.setTextColor(...gray);doc.text(String(i+1),W-MR,y,{align:'right'});y+=7});

  np();sT('1. Identificação do Solicitante');
  bT(`${vv.cli?`O(A) Sr.(a) ${vv.cli}, proprietário(a) do ${vv.uni||'imóvel'}${vv.emp?' do '+vv.emp:''}${vv.end?', localizado(a) à '+vv.end:''}, neste ato, solicitou`:'O(A) solicitante solicitou'} este Relatório Técnico de Vistoria de Imóvel Novo afim de documentar as possíveis manifestações patológicas, falhas, defeitos e vícios de construção. Elaborado em conformidade com NBR 16055, NBR 6118, NBR 7200, NBR 9574, NBR 9575, NBR 8160 da ABNT e norma de Inspeção Predial do IBAPE.`);

  chk(30);y+=8;sT('2. Dados Iniciais');
  const df=vv.dat?new Date(vv.dat+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}):vv.cr||'';
  if(vv.emp||vv.uni)bT(`Edificação: ${vv.uni?vv.uni+' – ':''}${vv.emp||''}`);
  if(vv.end)bT(`Endereço: ${vv.end}`);
  bT('Responsável: Engª Civil Fernanda Linde\nCREA RS263440');
  bT(`Data da vistoria: ${df}`);

  chk(20);y+=8;sT('3. Sistemas Construtivos Inspecionados');
  (vv.sis||'').split(';').filter(s=>s.trim()).forEach(s=>{chk(7);doc.setFontSize(9.5);doc.setFont('helvetica','normal');doc.setTextColor(...dark);doc.text('•  '+s.trim(),ML+4,y);y+=6});

  let fn=1;
  for(let ci=0;ci<comodos.length;ci++){
    const c=comodos[ci];const fotos=vv.comodos[c]||[];
    np();sT(`${ci+4}. ${c.toUpperCase()}`);
    if(!fotos.length){bT('Nenhuma anotação.',{cl:gray,st:'italic'});continue}
    for(const f of fotos){
      if(f.src&&f.src.startsWith('data:')){
        chk(65);
        try{const iw=Math.min(TW,110),ih=80;doc.addImage(f.src,'JPEG',(W-iw)/2,y,iw,ih);y+=ih+3;doc.setFontSize(8);doc.setFont('helvetica','italic');doc.setTextColor(...gray);doc.text(`Foto ${fn} – ${(f.leg||'Imagem').substring(0,55)}`,W/2,y,{align:'center'});y+=6}catch(e){}
      }
      fn++;
      if(f.leg){chk(10);doc.setFontSize(9.5);doc.setFont('helvetica','bold');doc.setTextColor(...or);const lb='Descrição: ';doc.text(lb,ML,y);const lw=doc.getTextWidth(lb);doc.setFont('helvetica','normal');doc.setTextColor(...dark);const dl=doc.splitTextToSize(f.leg,TW-lw);doc.text(dl[0],ML+lw,y);if(dl.length>1){y+=5;doc.text(doc.splitTextToSize(dl.slice(1).join(' '),TW),ML,y);y+=dl.length*4}y+=6}
      if(f.prog){chk(10);doc.setFontSize(9.5);doc.setFont('helvetica','bold');doc.setTextColor(...or);const lb='Prognóstico: ';doc.text(lb,ML,y);const pw=doc.getTextWidth(lb);doc.setFont('helvetica','normal');doc.setTextColor(...dark);const pl=doc.splitTextToSize(f.prog,TW-pw);doc.text(pl[0],ML+pw,y);if(pl.length>1){y+=5;doc.text(doc.splitTextToSize(pl.slice(1).join(' '),TW),ML,y);y+=pl.length*4}y+=8}
    }
  }

  chk(30);y+=8;sT(`${comodos.length+4}. Conclusão`);bT(vv.conc||'');
  chk(60);y+=20;bT('Atenciosamente,');y+=26;
  doc.setFillColor(...dark);doc.rect(W-MR-60,y,60,0.5,'F');y+=4;
  doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(...or);doc.text('Engª Civil Fernanda Linde',W-MR,y,{align:'right'});y+=5;
  doc.setFont('helvetica','normal');doc.setTextColor(...dark);doc.setFontSize(9);
  doc.text('CREA RS263440',W-MR,y,{align:'right'});y+=5;
  doc.text(new Date().toLocaleDateString('pt-BR'),W-MR,y,{align:'right'});
  ftr();
  doc.save(`Vistoria_${(vv.cli||'rel').replace(/\s+/g,'_')}_${(vv.dat||new Date().toISOString().slice(0,10))}.pdf`);
  toast('PDF gerado!');
}
